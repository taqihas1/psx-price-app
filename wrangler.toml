name = "psx-price-app"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Create first: npx wrangler kv namespace create PSX_HISTORY
# then paste the returned id below
kv_namespaces = [
  { binding = "PSX_HISTORY", id = "REPLACE_WITH_YOUR_KV_ID" }
]

# Daily at 12:00 UTC = 5:00 PM PKT (PSX closes 3:30 PM PKT)
[triggers]
crons = ["0 12 * * *"]
